name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t sentinel:ci .

      - name: Run container and smoke-test it
        run: |
          docker run -d --name sentinel-ci -p 8000:8000 -e SENTINEL_USE_MOCKS=true sentinel:ci

          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/healthz > /dev/null; then
              echo "healthz OK after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:8000/healthz

          # Real end-to-end request through the running container: ingest an
          # alert, confirm it's ACKed and later shows up fully enriched.
          incident_id=$(curl -sf -X POST http://localhost:8000/webhook/alert \
            -H "Content-Type: application/json" \
            -d '{"id":"ci-1","title":"CI smoke test","service":"checkout-service"}' \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          sleep 1
          # "brief":{...} (an object, not null) proves the background task
          # actually ran stages 1-4 and persisted the result, not just that
          # the incident record exists.
          curl -sf "http://localhost:8000/incidents/${incident_id}" | grep -q '"brief":{' || {
            echo "incident did not enrich"; docker logs sentinel-ci; exit 1;
          }

      - name: Container logs
        if: always()
        run: docker logs sentinel-ci

      - name: Stop container
        if: always()
        run: docker rm -f sentinel-ci
